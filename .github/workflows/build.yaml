            if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^\s]*&)?v=|shorts\/|embed\/|live\/|v\/)|youtube-nocookie\.com\/embed\/)([A-Za-z0-9_-]{11})/))return{k:'yt',id:m[1]};
            if(m=u.match(/tiktok\.com\/(?:@[^\/\s]+\/)?(?:video|embed\/v2|embed|player\/v1)\/(\d{8,25})/))return{k:'tt',id:m[1],u};
            if(/^https?:\/\/[a-z0-9.-]*tiktok\.com\//i.test(u))return{k:'tts',u};
            if(/^[A-Za-z0-9_-]{11}$/.test(u))return{k:'yt',id:u};
            if(/^\d{15,25}$/.test(u))return{k:'tt',id:u};
            return null}
          const tiUrl=tr=>tr.k==='yt'?'https://www.youtube.com/watch?v='+tr.id:(tr.u&&/^https?:/.test(tr.u)?tr.u:'https://www.tiktok.com/@tiktok/video/'+tr.id);
          function muRow(tr){pop.querySelectorAll('.tr[data-tid="'+tr.id+'"]').forEach(r=>{const b=r.querySelector('b');if(b)b.textContent=tr.n;const k=r.querySelector('.tk2');let i=k.querySelector('img');if(tr.th){if(!i){i=document.createElement('img');i.alt='';i.onerror=()=>{i.style.display='none'};k.insertBefore(i,k.firstChild)}i.src=tr.th}})}
          function muInfo(tr){
            const u=tr.k==='yt'?'https://www.youtube.com/oembed?format=json&url='+encodeURIComponent(tiUrl(tr)):'https://www.tiktok.com/oembed?url='+encodeURIComponent(tiUrl(tr));
            fx(u).then(r=>{if(!r||!r.body)return;let j=null;try{j=JSON.parse(r.body)}catch(e){}if(!j)return;
              const n=((j.author_name?j.author_name+' · ':'')+(j.title||'')).trim();if(n)tr.n=n.slice(0,90);if(j.thumbnail_url)tr.th=j.thumbnail_url;musSave();muRow(tr);muUi()})}
          function muAddTr(P,o,msgs){
            if(P.t.some(x=>x.id===o.id&&x.k===o.k))return false;
            const tr={k:o.k,id:o.id,u:o.u||'',n:o.k==='yt'?'YouTube':'TikTok',th:o.k==='yt'?'https://i.ytimg.com/vi/'+o.id+'/mqdefault.jpg':''};
            P.t.push(tr);musSave();muInfo(tr);return true}
          function muResolve(u,P){
            fx(u).then(r=>{
              const m=r&&((String(r.url).match(/\/video\/(\d{8,25})/))||(String(r.body).match(/\/video\/(\d{8,25})/)));
              if(m){const added=muAddTr(P,{k:'tt',id:m[1],u:r.url&&/\/video\//.test(r.url)?r.url:u});if(view==='music'&&pop.classList.contains('o'))buildPop();if(!added)muMsg(L('Déjà dans la playlist.'))}
              else muMsg(L('Lien non reconnu : copie le lien complet de la vidéo.'))})}
          function muMsg(m){const e=pop.querySelector('#mmsg');if(e)e.textContent=m||''}
          /* lecteurs */
          function ttSend(type,value){try{if(ttF&&ttF.contentWindow)ttF.contentWindow.postMessage({'x-tiktok-player':true,type,value},'*')}catch(e){}}
          function ttLoad(tr){
            const w=$('ytw');const oldF=(kind==='tt'&&ttF)?ttF:null;if(!oldF)w.innerHTML='';YP=null;ypOk=0;kind='tt';
            const f=document.createElement('iframe');f.setAttribute('allow','autoplay; encrypted-media');
            f.src='https://www.tiktok.com/player/v1/'+tr.id+'?autoplay=1&loop=0&controls=0&progress_bar=0&play_button=0&volume_control=0&fullscreen_button=0&timestamp=0&music_info=0&description=0&rel=0&native_context_menu=0&closed_caption=0';
            w.appendChild(f);ttF=f;if(oldF){try{oldF.contentWindow.postMessage({'x-tiktok-player':true,type:'pause',value:undefined},'*')}catch(e){}setTimeout(()=>{try{oldF.remove()}catch(e){}},1200)}}
          function ytApi(cb){
            if(window.YT&&window.YT.Player){cb();return}
            (window._yq=window._yq||[]).push(cb);
            if(document.getElementById('ytapi'))return;
            window.onYouTubeIframeAPIReady=()=>{(window._yq||[]).splice(0).forEach(f=>f())};
            const s=document.createElement('script');s.id='ytapi';s.src='https://www.youtube.com/iframe_api';
            s.onerror=()=>{s.remove();mErr=L('Connexion impossible');muUi()};document.head.appendChild(s)}
          function ytLoad(tr){
            if(kind==='yt'&&YP&&ypOk){try{YP.loadVideoById(tr.id);if(MU.mu)YP.mute();else YP.unMute()}catch(e){}return}
            kind='yt';ttF=null;YP=null;ypOk=0;ytPend=tr.id;$('ytw').innerHTML='<div id="ytp"></div>';
            ytApi(()=>{if(kind!=='yt'||!$('ytp'))return;
              YP=new window.YT.Player('ytp',{width:180,height:320,playerVars:{autoplay:1,playsinline:1,controls:0,disablekb:1,fs:0,rel:0,modestbranding:1},events:{
                onReady:()=>{ypOk=1;if(ytPend){const v=ytPend;ytPend='';try{YP.loadVideoById(v);if(MU.mu)YP.mute()}catch(e){}}},
                onStateChange:e=>muState(e.data),
                onError:()=>muFail()}})})}
          function muState(s){if(s===1){mPl=1;mErr='';errN=0;wd++}else if(s===2){mPl=0}else if(s===0){mPl=0;muNext(1,true)}muUi()}
          function muFail(){mPl=0;mErr=L('Vidéo indisponible');errN++;muUi();const w=wd;setTimeout(()=>{if(w!==wd)return;mErr='';if(errN<4)muNext(1,true);else muUi()},1200)}
          window.addEventListener('message',e=>{
            const d=e.data;if(!d||typeof d!=='object'||!d['x-tiktok-player']||!ttF||e.source!==ttF.contentWindow)return;
            if(d.type==='onPlayerReady'){ttSend('play');ttSend(MU.mu?'mute':'unMute')}
            else if(d.type==='onStateChange')muState(d.value);
            else if(d.type==='onError')muFail()});
          function muPlayTr(tr,pl){
            const same=nowTr===tr&&kind===tr.k&&(tr.k==='tt'?ttF:YP&&ypOk);
            nowTr=tr;nowPl=pl;mErr='';wd++;if(!window.__au){window.__au=1;nat({au:1})}
            if(same){if(tr.k==='tt'){ttSend('seekTo',0);ttSend('play')}else{try{YP.seekTo(0,true);YP.playVideo()}catch(e){}}}
            else if(tr.k==='tt')ttLoad(tr);else ytLoad(tr);
            mPl=1;muUi();
            const w=wd,t0=tr;setTimeout(()=>{if(w===wd&&nowTr===t0&&!mPl&&!mErr){mErr=L('Lecture impossible, essaie un autre lien');muUi()}},12000)}
          function muPlay(i){const P=curPL(),tr=P.t[i];if(tr)muPlayTr(tr,P.id)}
          function muNext(dir,auto){
            const P=MU.pl.find(p=>p.id===nowPl)||curPL();if(!P.t.length)return;
            let i=P.t.indexOf(nowTr);
            if(MU.sh&&P.t.length>1){let j;do{j=Math.floor(Math.random()*P.t.length)}while(j===i);i=j}
            else{i+=dir;if(i>=P.t.length){if(auto&&!MU.rp){mPl=0;muUi();return}i=0}if(i<0)i=P.t.length-1}
            muPlayTr(P.t[i],P.id)}
          function muPP(){if(kind==='tt')ttSend(mPl?'pause':'play');else try{mPl?YP.pauseVideo():YP.playVideo()}catch(e){}}
          function muTog(){
            if(!nowTr){const P=curPL();if(P.t.length)muPlay(0);return}
            muPP();mPl=mPl?0:1;muUi()}
          function muMute(){if(kind==='tt')ttSend(MU.mu?'mute':'unMute');else try{MU.mu?YP.mute():YP.unMute()}catch(e){}}
          function muUi(){
            const a=pop.querySelector('#mnt');if(a)a.textContent=mErr||(nowTr?nowTr.n:L('Rien en lecture'));
            const b=pop.querySelector('#mpp');if(b)b.innerHTML=mPl?MI.pa:MI.pl;
            pop.querySelectorAll('.tr').forEach(r=>r.classList.toggle('on',!!nowTr&&r.dataset.tid===nowTr.id&&curPL().id===nowPl));
            const s=pop.querySelector('#msh');if(s)s.classList.toggle('on',!!MU.sh);
            const p=pop.querySelector('#mrp');if(p)p.classList.toggle('on',!!MU.rp)}
          const nmv=id=>{const e=pop.querySelector('#'+id);return e?e.value.trim().slice(0,28):''};
          function muAct(d){
            const a=d.ma,P=curPL();
            if(a==='tog')return muTog();
            if(a==='next')return muNext(1);
            if(a==='prev')return muNext(-1);
            if(a==='play'){muPlay(+d.i);return}
            if(a==='sh')MU.sh=MU.sh?0:1;
            else if(a==='rp')MU.rp=MU.rp?0:1;
            else if(a==='mu'){MU.mu=MU.mu?0:1;muMute()}
            else if(a==='psel')MU.cur=d.id;
            else if(a==='pnew'){const id='p'+Date.now().toString(36);MU.pl.push({id,n:nmv('munm')||('Playlist '+(MU.pl.length+1)),t:[]});MU.cur=id}
            else if(a==='pren'){const n=nmv('munm');if(n)P.n=n}
            else if(a==='pdel'){if(MU.pl.length>1){MU.pl=MU.pl.filter(p=>p!==P);MU.cur=MU.pl[0].id}else P.t=[]}
            else if(a==='rm')P.t.splice(+d.i,1);
            else if(a==='add'){
              const e=pop.querySelector('#muurl'),toks=((e&&e.value)||'').split(/\s+/).filter(Boolean),late=[];let bad=0;
              toks.forEach(u=>{const o=parseLink(u);if(!o)bad++;else if(o.k==='tts')late.push(o.u);else muAddTr(P,o)});
              musSave();buildPop();
              late.forEach(u=>muResolve(u,P));
              if(late.length)muMsg(L('Recherche du lien…'));else if(bad)muMsg(L('Lien non reconnu : colle un lien YouTube ou TikTok.'));
              return}
            musSave();buildPop()}
          const musBody=()=>{const P=curPL();return `<div class="card np"><div class="mnow"><span class="mnt" id="mnt">${L('Rien en lecture')}</span></div><div class="ctl"><button type="button" class="rb2 sm" id="msh" data-ma="sh" aria-label="Shuffle">${MI.sh}</button><button type="button" class="rb2" data-ma="prev" aria-label="Prev">${MI.pv}</button><button type="button" class="rb2 big" id="mpp" data-ma="tog" aria-label="Play">${MI.pl}</button><button type="button" class="rb2" data-ma="next" aria-label="Next">${MI.nx}</button><button type="button" class="rb2 sm" id="mrp" data-ma="rp" aria-label="Repeat">${MI.rp}</button></div><div class="it trw"><span>${L('Couper le son')}</span><button type="button" class="tg" data-ma="mu" aria-pressed="${MU.mu?'true':'false'}" aria-label="Mute"></button></div></div>`
          +sc('Ajouter des liens')+`<div class="card"><div class="it"><div class="sr"><input type="text" class="nm" id="muurl" placeholder="${esc(L('Lien YouTube ou TikTok'))}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button type="button" class="bt pri" data-ma="add">${L('Ajouter')}</button></div><div class="stt" id="mmsg" style="padding:8px 2px 0"></div></div></div>`
          +sc('Playlists')+`<div class="card"><div class="it"><div class="chs">${MU.pl.map(p=>`<button type="button" class="ch${p.id===P.id?' on':''}" data-ma="psel" data-id="${p.id}">${esc(p.n)}<small>${p.t.length}</small></button>`).join('')}</div></div><div class="it"><div class="sr"><input type="text" class="nm" id="munm" maxlength="28" placeholder="${esc(L('Nom de la playlist'))}" autocomplete="off"><button type="button" class="bt pri" data-ma="pnew">${L('Créer')}</button></div><div class="chs sp2"><button type="button" class="bt" data-ma="pren">${L('Renommer')}</button><button type="button" class="bt" data-ma="pdel">${L('Supprimer')}</button></div></div></div>`
          +`<div class="sc">${esc(P.n)}</div><div class="card trl">${P.t.length?P.t.map((tr,i)=>`<div class="tr" data-tid="${tr.id}"><button type="button" class="tk2" data-ma="play" data-i="${i}">${tr.th?`<img src="${esc(tr.th)}" alt="" onerror="this.style.display='none'">`:''}<b>${esc(tr.n)}</b></button><button type="button" class="bt dl" data-ma="rm" data-i="${i}" aria-label="Remove">×</button></div>`).join(''):`<div class="stt" style="padding:12px 2px">${L('Playlist vide.')}</div>`}</div>`};
          /* ---------- pages ---------- */
          function pageBody(){
            if(view==='timer')return `<div class="it s1"><label>${L('Sélectionner le chrono')}</label><div class="chs" data-k="mode">${MODES.map(m=>`<button type="button" class="ch${S.mode===m[0]?' on':''}" data-v="${m[0]}">${L(m[1])}</button>`).join('')}</div></div>`+(S.mode==='none'?`<div class="stt">${L('Aucun timer : règle ton texte dans l’onglet Texte.')}</div>`:modeBody(S.mode))+sc('Options')+card(['dockOn','auto','aoff','asens','asc','asd','ag','stC','stD','dbg','fm'])+`<div class="card">${row(['s','theme','themel',[['light','Blanc'],['dark','Noir'],['auto','Auto']]])}</div>`+sc('Image des réglages')+`<div class="card"><div class="it"><div class="chs"><button type="button" class="bt ibt" data-a="pkp">${t('pick')}</button><button type="button" class="bt ibt" data-a="rmp">${t('rem')}</button></div></div>${row(['r','pbo','Opacité de l’image',5,100])}</div><div class="stt">${L('Personnalise le fond des réglages avec ta propre photo.')}</div>`;
            if(view==='screen')return `<div class="card">${rs(['str'])}<div id="sx">${resHtml()}<div id="rc">${rs(['rx','ry'])}</div>${rs(['sp'])}<div class="stt in" id="si"></div></div></div>`+card(['sat','fps'])+gpBody();
            if(view==='speed')return `<div class="card">${row(['s','spm','spd',[...SPD,['custom','cust']]])}<div class="it" id="spc"><label>${t('spcl')}</label><div class="rcs"><input type="text" inputmode="decimal" class="ni" id="spci" maxlength="5" value="${String(S.spc).replace('.',',')}" aria-label="${t('spcl')}"></div></div>${row(['s','smd','smdl',[['0','m0'],['1','m1'],['2','m2'],['3','m3'],['4','m4']]])}</div><div class="stt" id="spst"></div><div class="stt">${t('spnote')}</div>`;
            if(view==='boost')return card(['abOn'])+`<div class="card">${row(['s','abN','abNl',[['2','2'],['3','3']]])}</div><div class="card">${row(['s','abSp','abSpl',[['0','Normal'],['1','Rapide'],['2','Ultra']]])}</div>`+card(['abDl'])+`<div class="card"><div class="it"><button type="button" class="bt pri" id="abEdit">Placer les carrés sur les boosts</button></div><div class="it"><button type="button" class="bt" id="abTest">Tester maintenant</button></div></div><div class="stt">Au son de départ de la partie, l’Auto Boost appuie une fois sur chaque boost (carrés 1, 2, 3), très vite, puis s’arrête. Il recommence à chaque départ. Place d’abord les carrés sur tes boosts (à gauche), puis « OK ».</div>`;
            if(view==='macro')return macroBody();if(view==='kbd')return kbdBody();if(view==='image')return ovBody();
            if(view==='music')return musBody();
            if(view==='support')return supBody();
            if(view==='text')return card(['txOn'])+`<div id="pe"><div class="card">${rs(['glue','txt'])}</div>${card(['tsz','tdo','tcol','tb'])}<div class="card">${rs(['tfx','tan'])}</div></div>`;
            return '';
          }

          /* ---------- Pack graphique : étalonnage des couleurs du jeu (matrice envoyée au filtre natif) ---------- */
          const GPP=[['vivid','Éclatant'],['toon','Cartoon'],['cine','Cinéma'],['clear','Net']];
          const gpBody=()=>`<div class="sc">${L('Pack graphique')}</div><div class="card">${rs(['gp'])}<div id="gpx">${row(['s','gpp','Style du pack',GPP])}${rs(['gpi'])}</div></div><div class="stt">${L('Améliore les couleurs et le contraste du jeu. Les contours et ombres de dessin animé ne peuvent pas être ajoutés depuis l’overlay.')}</div>`;
          function gpMatrix(){
            if(!S.gp)return null;
            const P={vivid:[1.30,1.12,.01,0],toon:[1.55,1.30,-.015,.03],cine:[1.12,1.18,-.02,.05],clear:[1.10,1.22,.02,0]}[S.gpp]||[1.30,1.12,.01,0];
            const k=Math.max(0,Math.min(1.5,(+S.gpi||0)/100)),sa=1+(P[0]-1)*k,c=1+(P[1]-1)*k,b=P[2]*k,wm=P[3]*k,lr=.2126,lg=.7152,lb=.0722;
            const m=[lr*(1-sa)+sa,lg*(1-sa),lb*(1-sa),lr*(1-sa),lg*(1-sa)+sa,lb*(1-sa),lr*(1-sa),lg*(1-sa),lb*(1-sa)+sa],o=[];
            for(let r=0;r<3;r++){const g=r===0?1+wm:r===2?1-wm:1;for(let q=0;q<3;q++)o.push(m[r*3+q]*c*g);o.push(0);o.push((.5-.5*c+b)*g)}
            o.push(0,0,0,1,0);return o.map(x=>Math.round(x*1e4)/1e4)
          }
          /* ---------- Macro : glissements automatiques (gauche / droite / haut / bas) ---------- */
          const MDIRS=[[1,'←'],[2,'→'],[4,'↑'],[8,'↓']],MPRE=[[3,'Gauche / Droite'],[12,'Haut / Bas'],[15,'Tout']];
          const macroBody=()=>card(['mEn'])+`<div id="mcx"><div class="card"><div class="it"><label>${L('Directions')}</label><div class="chs">${MDIRS.map(o=>`<button type="button" class="ch mdb${(S.mDir&o[0])?' on':''}" data-b="${o[0]}" style="font-size:20px">${o[1]}</button>`).join('')}</div><div class="chs" style="margin-top:8px">${MPRE.map(o=>`<button type="button" class="ch mpr${S.mDir===o[0]?' on':''}" data-b="${o[0]}">${L(o[1])}</button>`).join('')}</div></div>${row(['s','mMode','Mode',[['seq','Alterné'],['rnd','Aléatoire'],['all','Simultané']]])}${row(['s','mSpd','Vitesse de la macro',[['1','Normal'],['2','Rapide'],['3','Ultra']]])}${rs(['mDist'])}</div><div class="card"><div class="it"><button type="button" class="bt" id="mRst">${L('Replacer le bouton')}</button></div></div><div class="stt">${L('Un bouton rond apparaît à l’écran : touche-le pour lancer ou arrêter la macro (tu peux le déplacer). Elle envoie les glissements au jeu automatiquement.')}</div></div>`;
          const kbdBody=()=>card(['kbEn'])+`<div id="kbx"><div class="card">${row(['s','kbMode','Vitesse du clavier',[['0','Normal'],['1','Instantané']]])}${rs(['kbDist'])}</div></div><div class="stt">${L('Avec un clavier connecté : flèches ou Z Q S D = glissement dans le jeu. Plusieurs touches en même temps = les mouvements s’enchaînent instantanément. Touche maintenue = long mouvement.')}</div>`;
          function kbSync(){const on=(S.kbEn&&!pop.classList.contains('o')&&!document.body.classList.contains('pre'))?1:0,k=[on,+S.kbDist||200,(S.kbMode==='0'||S.kbMode===0)?0:1],j=k.join();if(window.__kb!==j){window.__kb=j;nat({kb:k})}}
          function mbPaint(){const b=$('mbtn');if(!b)return;b.classList.toggle('on',!!S.mOn);$('mbt').textContent=S.mOn?'ON':'OFF';b.style.display=S.mEn?'flex':'none'}
          function mbPlace(){const b=$('mbtn');if(!b)return;if(S.mx==null){b.style.left='';b.style.top=''}else{b.style.left=S.mx+'px';b.style.top=S.my+'px'}}
          function mcSync(){
            const on=(S.mEn&&S.mOn&&!pop.classList.contains('o')&&!document.body.classList.contains('pre'))?1:0;
            const k=[on,+S.mDir||3,({seq:0,rnd:1,all:2})[S.mMode]||0,+S.mSpd||3,+S.mDist||140],j=k.join();
            if(window.__mc!==j){window.__mc=j;nat({mc:k})}
          }
          (function(){
            const b=$('mbtn');let g=null,mv=false;
            b.addEventListener('pointerdown',e=>{if(pop.classList.contains('o'))return;e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}const r=b.getBoundingClientRect();g={dx:e.clientX-r.left,dy:e.clientY-r.top,sx:e.clientX,sy:e.clientY};mv=false});
            b.addEventListener('pointermove',e=>{if(!g)return;if(!mv&&Math.hypot(e.clientX-g.sx,e.clientY-g.sy)<8)return;mv=true;const r=b.getBoundingClientRect();S.mx=Math.round(Math.max(0,Math.min(innerWidth-r.width,e.clientX-g.dx)));S.my=Math.round(Math.max(0,Math.min(innerHeight-r.height,e.clientY-g.dy)));b.style.left=S.mx+'px';b.style.top=S.my+'px';rep()});
            b.addEventListener('pointerup',()=>{if(!g)return;const was=mv;g=null;if(was){save();return}S.mOn=S.mOn?0:1;mbPaint();mcSync();save()});
            b.addEventListener('pointercancel',()=>{g=null});
          })();
          /* ---------- Bouton thème (à côté de la langue) ---------- */
          const ICO={light:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M5.3 18.7L7 17M17 7l1.7-1.7"/></svg>',dark:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 13.3A8.6 8.6 0 1110.7 3.5a6.9 6.9 0 009.8 9.8z"/></svg>',auto:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8.6"/><path d="M12 3.4v17.2" /><path d="M12 3.4a8.6 8.6 0 010 17.2z" fill="currentColor"/></svg>'};
          const thIcon=()=>ICO[S.theme]||ICO.auto;
          const TABS=[['timer','tTimer'],['screen','tScreen'],['speed','tSpeed'],['boost','Auto Boost'],['macro','Macro'],['kbd','Clavier'],['image','tImage'],['text','tText'],['music','Musique'],['support','Support & Contact 💬']];
          const LGS=[['fr','Français','FR'],['en','English','EN'],['zh','中文','中文'],['pt','Português','PT']];
