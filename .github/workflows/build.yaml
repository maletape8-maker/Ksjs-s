name: Build BYSG dylib
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Ecrire chrono.html (1/6)
        run: |
          cat > chrono.html <<'BYSG_HTML_END'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
          <title>Chrono</title>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400&family=Libre+Baskerville:wght@700&family=Playfair+Display:wght@800&family=Abril+Fatface&family=DM+Serif+Display&family=Bodoni+Moda:wght@700&family=Roboto+Slab:wght@700&family=Zilla+Slab:wght@700&text=0123456789%3A.&display=swap">
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Montserrat:wght@700&family=Space+Grotesk:wght@600&family=Oswald:wght@600&family=Bebas+Neue&family=Anton&family=Barlow+Condensed:wght@600&text=0123456789%3A.&display=swap">
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Audiowide&family=Exo+2:wght@700&family=Rajdhani:wght@700&family=Teko:wght@500&family=Roboto+Mono:wght@500&family=JetBrains+Mono:wght@700&family=Share+Tech+Mono&family=Major+Mono+Display&family=VT323&family=Press+Start+2P&text=0123456789%3A.&display=swap">
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@600&family=Righteous&family=Lilita+One&family=Pacifico&family=Permanent+Marker&text=0123456789%3A.&display=swap">
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@700&display=swap">
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
          <style>
          :root{--bg:#fafaf9;--sf:#fff;--sub:#f2f1ef;--t1:#181715;--t3:#8b8986;--bd:rgba(0,0,0,.1);--bs:rgba(0,0,0,.06);--ac:#1c1c1f;--off:rgba(120,120,128,.3);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
          @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0f;--sf:#151518;--sub:#1e1e23;--t1:#edece9;--t3:#7a7874;--bd:rgba(255,255,255,.1);--bs:rgba(255,255,255,.06);--ac:#8b7cf0}}
          :root[data-theme="dark"]{--bg:#0d0d0f;--sf:#151518;--sub:#1e1e23;--t1:#edece9;--t3:#7a7874;--bd:rgba(255,255,255,.1);--bs:rgba(255,255,255,.06);--ac:#8b7cf0}
          *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
          html,body{height:100%;background:transparent;pointer-events:none}
          input,textarea{user-select:text;-webkit-user-select:text}
          body{font-family:Inter,'Segoe UI',Arial,sans-serif;background:transparent;color:var(--t1);overflow:hidden;-webkit-text-size-adjust:100%}
          #w{pointer-events:auto;outline:none;width:max-content;height:max-content;display:flex;flex-direction:column;align-items:center;-webkit-touch-callout:none;position:fixed;transform-origin:top left;cursor:grab;touch-action:none;z-index:2147483600}
          #w.d,#tw.d{cursor:grabbing}
          #tw{pointer-events:auto;position:fixed;display:none;width:max-content;height:max-content;touch-action:none;cursor:grab;-webkit-touch-callout:none;z-index:2147483600}
          #chrono{display:none;gap:3px}
          .tb{width:85px;height:60px;background:#000;border-radius:18px;display:flex;justify-content:center;align-items:center;color:#fff;font-size:37px;font-weight:300;font-family:Inter,monospace;letter-spacing:1.6px}
          .tb.lb{width:95px;letter-spacing:.4px;font-size:30px}
          #ls{display:flex;align-items:center;justify-content:flex-end;padding:0 10px;background:transparent}
          #dg{font-family:"Century Gothic",Calibri,"Segoe UI",Arial,sans-serif;font-weight:700;font-size:43.75px;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.5)) drop-shadow(2px 2px 0 rgba(0,0,0,.5))}
          #ls.ns #dg{filter:none}
          #tx{display:none;text-align:center}
          #tbx{display:inline-block;line-height:1.2;padding:4px 8px}
          #tt{display:inline-block;white-space:pre;text-align:center}
          .rb{background:linear-gradient(90deg,#f33,#fc3,#3f6,#3cf,#93f,#f33);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
          @keyframes rb{to{background-position:200% 0}}@keyframes float{50%{transform:translateY(-10px)}}@keyframes pulse{50%{transform:scale(1.15)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes bounce{50%{transform:translateY(-20px)}}@keyframes blink{50%{opacity:.1}}@keyframes sway{0%,100%{transform:translateX(-30px)}50%{transform:translateX(30px)}}
          @keyframes fi{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
          @keyframes pin{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:none}}

          #pop{pointer-events:auto;position:fixed;top:0;left:0;right:0;bottom:0;margin:auto;width:min(320px,92vw);height:min(560px,84vh);display:none;flex-direction:column;border-radius:20px;overflow:hidden;background:var(--sf);border:1px solid var(--bs);box-shadow:0 24px 60px rgba(0,0,0,.28);z-index:2147483647}
          #pop.o{display:flex;animation:pin .32s cubic-bezier(.2,.9,.3,1.1)}
          #pop.kb{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 8px);height:min(330px,46vh)}
          .ph{flex:none;display:flex;align-items:center;gap:8px;padding:14px 12px 4px 18px}
          .ph h3{font-size:1rem;font-weight:600;letter-spacing:-.01em}
          .ph .by{margin-right:auto;font-size:.68rem;font-weight:600;color:var(--t3);letter-spacing:.05em}
          .ph button{background:0;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--t3);width:34px;height:34px;border-radius:50%}
          .tabs{flex:none;position:relative;display:flex;gap:2px;padding:6px 12px 10px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
          .tabs::-webkit-scrollbar{display:none}
          .tab{flex:none;border:0;background:none;color:var(--t3);font:600 .76rem Inter,sans-serif;padding:8px 13px;border-radius:99px;cursor:pointer;touch-action:manipulation;transition:background .2s,color .2s}
          .tab.on{background:var(--sub);color:var(--t1)}
          .pc{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:2px 14px 18px}
          .tp{display:none}.tp.on{display:block;animation:fi .28s ease}
          #pch,#pls,#sx,#rc,#pe,#bxo,#sko,#tso,#spc{animation:fi .28s ease}
          .sc{font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin:18px 4px 8px}
          .tp>.sc:first-child,#pls>.sc:first-child{margin-top:12px}
          .card{background:var(--bg);border:1px solid var(--bs);border-radius:14px;padding:0 14px;margin-bottom:10px}
          .it{padding:14px 0;border-top:1px solid var(--bs)}
          .card>.it:first-child{border-top:0}
          .it>label{display:block;font-size:.78rem;font-weight:500;margin-bottom:10px}
          .it>label .v{float:right;color:var(--t3);font-weight:500;font-variant-numeric:tabular-nums}
          .it.trw{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.8rem;font-weight:500;padding:12px 0}
          .it input[type=range]:not(.hu){-webkit-appearance:none;appearance:none;display:block;width:100%;height:4px;border-radius:99px;background:var(--off);outline:none}
          .it input[type=range]:not(.hu)::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.14);box-shadow:0 1px 5px rgba(0,0,0,.28)}
          .tg{flex:none;width:46px;height:28px;padding:0;border:0;border-radius:99px;background:var(--off);position:relative;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none;transition:background .22s}
          .tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .22s cubic-bezier(.3,.9,.3,1.1)}
          .tg[aria-pressed=true]{background:var(--ac)}.tg[aria-pressed=true]::after{transform:translateX(18px)}
          .chs{display:flex;flex-wrap:wrap;gap:6px}
          .ch,.bt{flex:1 1 auto;padding:9px 11px;border-radius:99px;border:0;background:var(--sub);color:var(--t1);font:600 .74rem Inter,sans-serif;text-align:center;cursor:pointer;touch-action:manipulation;transition:background .2s,color .2s,transform .12s}
          .ch:active,.bt:active{transform:scale(.96)}
          .ch.on{background:var(--ac);color:#fff}
          .ch small{display:block;font-weight:500;opacity:.6;font-size:.62rem;margin-top:2px}
          .cs{width:100%;height:34px;border:1px solid var(--bd);border-radius:9px;color:#fff;text-shadow:0 0 3px #000;font:600 .72rem Inter,monospace;cursor:pointer}
          .cb{display:none;padding-top:10px}.cp.o .cb{display:block}
          .sv{position:relative;height:110px;border-radius:9px;touch-action:none;cursor:crosshair}
          .sv i{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.5);pointer-events:none}
          .hu{margin-top:12px;height:14px;border-radius:7px;-webkit-appearance:none;appearance:none;background:linear-gradient(90deg,red,#ff0,#0f0,#0ff,#00f,#f0f,red)}
          .hu::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.4)}
          .ta,.ni{width:100%;min-width:0;background:var(--sub);border:1px solid transparent;border-radius:11px;color:var(--t1);font:500 16px/1.35 Inter,sans-serif;outline:none;-webkit-appearance:none;appearance:none}
          .ta{height:44px;padding:11px 13px;resize:none;display:block}
          .ni{padding:10px 12px;text-align:center}
          .ta:focus,.ni:focus{border-color:var(--ac)}
          .rcs{display:flex;align-items:center;gap:10px;color:var(--t3)}
          .stt{font-size:.7rem;line-height:1.5;color:var(--t3);padding:2px 2px 14px}
          .stt.in{padding:0 2px 12px}
          .ft{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px 12px 18px;border-top:1px solid var(--bs);font-size:.68rem;font-weight:500;color:var(--t3)}
          .dcb{flex:none;padding:8px 14px;border:0;border-radius:99px;background:#5865F2;color:#fff;font:600 .72rem Inter,sans-serif;cursor:pointer;touch-action:manipulation;transition:transform .12s}
          .dcb:active{transform:scale(.96)}
          #sp{pointer-events:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translate(-50%,-160%) scale(.92);opacity:0;z-index:2147483646;background:#000;color:rgba(255,255,255,.78);font:500 12px/1 Inter,'Segoe UI',Arial,sans-serif;letter-spacing:.02em;padding:9px 16px;border-radius:99px;border:1px solid rgba(255,255,255,.14);box-shadow:0 8px 24px rgba(0,0,0,.35);white-space:nowrap}
          #sp b{color:#fff;font-weight:600}
          #sp.in{animation:spin .6s cubic-bezier(.2,.9,.3,1.15) forwards}
          #sp.out{animation:spout .45s cubic-bezier(.5,0,.8,.4) forwards}
          @keyframes spin{from{opacity:0;transform:translate(-50%,-160%) scale(.92)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
          @keyframes spout{from{opacity:1;transform:translate(-50%,0) scale(1)}to{opacity:0;transform:translate(-50%,-160%) scale(.92)}}
          #ios{display:none;position:relative;width:235px;height:118px;border-radius:10px;color:#fff;background:#000;touch-action:none;-webkit-touch-callout:none}
          .ib{position:absolute;margin:0;padding:0;border:0;background:none;color:inherit;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:pointer;-webkit-appearance:none;appearance:none}
          .ib::before{content:"";position:absolute;top:-3px;left:-3px;right:-3px;bottom:-3px}
          .ib:active{opacity:.55}
          #iset{left:195px;top:7px;width:33px;height:25px;border-radius:7px;background:var(--ib,rgba(255,255,255,.18))}
          #irs{left:32px;top:78px;width:56px;height:40px}
          #itg{left:146px;top:78px;width:56px;height:40px}
          #ids,#iom{white-space:nowrap;line-height:1;font-variant-numeric:tabular-nums;pointer-events:none}
          #ids{position:absolute;left:0;top:28px;width:100%;height:50px;display:flex;align-items:center;justify-content:center}
          #iom{position:absolute;left:0;top:0;visibility:hidden}
          .ic{display:inline-block;text-align:center}.ic.co{width:.42em}.ic.dt{width:.3em}
          .bd .ic.co{width:.46em;color:transparent;position:relative}.bd .ic.dt{color:transparent;position:relative}
          .bd .co::before,.bd .co::after,.bd .dt::after{content:"";position:absolute;left:50%;width:.15em;height:.15em;margin-left:-.075em;background:var(--itc,#fff);transform:rotate(45deg)}
          .bd .co::before{top:.34em}.bd .co::after{top:.64em}.bd .dt::after{top:.66em}
          @keyframes iro{from{transform:translateY(.55em);opacity:0}to{transform:none;opacity:1}}
          @keyframes ifa{from{opacity:0}to{opacity:1}}
          @keyframes izo{from{transform:scale(1.6);opacity:0}to{transform:none;opacity:1}}
          #pop.ios{top:auto;bottom:0;margin:0;width:100%;height:min(58vh,580px);border-radius:28px 28px 0 0;background:#1c1c20;border:0;box-shadow:0 -10px 40px rgba(0,0,0,.45);color:#fff;font-family:Roboto,'Segoe UI',Inter,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
          #pop.ios.o{animation:ishow .3s cubic-bezier(.2,.9,.3,1)}
          @keyframes ishow{from{transform:translateY(100%)}to{transform:none}}
          #pop.ios #x{flex:none;display:block;width:100%;height:30px;border:0;background:none;position:relative;padding:0;border-radius:0}
          #pop.ios #x::after{content:"";position:absolute;left:50%;top:12px;width:56px;height:5px;margin-left:-28px;border-radius:3px;background:#6d6d72}
          #pop.ios .ipc{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px 20px 28px}
          #pop.ios .ig{background:#232328;border-radius:7px;overflow:hidden}
          #pop.ios .irw{display:flex;align-items:center;justify-content:space-between;min-height:54px;padding:0 14px;font-size:19px;color:#5cb8d1}
          #pop.ios .irh{cursor:pointer}
          #pop.ios .irl{color:#fff;font-size:16px}#pop.ios .irl .v{color:#9a9aa0;font-variant-numeric:tabular-nums}
          #pop.ios .sw{display:flex;align-items:center;gap:12px}
          #pop.ios .cs{width:30px;height:30px;border:0;border-radius:50%;padding:0;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
          #pop.ios .chv{display:block;width:9px;height:9px;border-top:2.5px solid #fff;border-right:2.5px solid #fff;transform:rotate(45deg);margin:0 6px 0 0;transition:transform .2s}
          #pop.ios .cp.o .chv{transform:rotate(135deg)}
          #pop.ios .cb{padding:2px 14px 16px}
          #pop.ios .tg{width:52px;height:30px;background:#3a3a3f}
          #pop.ios .tg::after{top:3px;left:3px;width:24px;height:24px;background:#8d8d93}
          #pop.ios .tg[aria-pressed=true]{background:#2f4f58}
          #pop.ios .tg[aria-pressed=true]::after{background:#5ec7dc;transform:translateX(22px)}
          #pop.ios .ist{font-size:19px;font-weight:700;margin:26px 0 12px 7px}
          #pop.ios .isl{-webkit-appearance:none;appearance:none;display:block;width:calc(100% - 28px);margin:2px 14px 22px;height:4px;border-radius:99px;background:#3d3d43;outline:none}
          #pop.ios .isl::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#5ec7dc;border:0}
          #pop.ios .chs{flex-wrap:nowrap;overflow-x:auto;gap:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -20px;padding:0 20px 2px}
          #pop.ios .chs::-webkit-scrollbar{display:none}
          #pop.ios .ch{flex:none;width:127px;height:84px;border-radius:12px;border:1px solid #47474c;background:#28282c;color:#fff;font:700 32px/1 'Roboto Condensed',Roboto,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0}
          #pop.ios .ch.on{background:#44666f;border-color:#44666f}
          #pop.ios .ch.f{background:#232328;border-color:transparent;height:72px;width:140px;font-size:30px}
          #pop.ios .ch.f.on{background:#44666f}
          #pop.ios .ch.m{font:600 18px/1 Roboto,Arial,sans-serif;height:64px}
          #pop.ios .ch small{font:500 11px/1 Roboto,Arial,sans-serif;opacity:.6;margin:0}
          .rl{position:relative}.rl em{font-style:normal;color:#7d8d93}.rl sub{position:absolute;left:55%;bottom:-9px;font-size:7px;color:#7d8d93}
          #pop .fl{flex:1}
          #pop .ph button{display:flex;align-items:center;justify-content:center}
          #pop .ph button svg{display:block}
          #pop.ios .isb{font-size:15px;font-weight:500;color:#9a9aa0;margin:16px 0 8px 7px}
          #pop.ios .ch.f{height:84px}
          #fps{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:calc(env(safe-area-inset-left,0px) + 8px);transform:none;z-index:2147483640;pointer-events:none;font:700 15px/1 'Trebuchet MS','Segoe UI',Arial,sans-serif;letter-spacing:.02em;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.65);white-space:nowrap;display:none}
          #fps b{color:#2be05c;font-weight:700}
          #ls{position:relative;isolation:isolate}
          #dk{display:none;position:relative;isolation:isolate;align-items:baseline;padding:10px 22px;border-radius:14px;white-space:nowrap;line-height:1;font-family:-apple-system,'SF Pro Display','Inter','Segoe UI',Arial,sans-serif;font-weight:700;font-size:44px;font-variant-numeric:tabular-nums;color:#fff}
          #dkc{font-size:.56em;margin-left:.04em}
          .bgc{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;border-radius:inherit;z-index:-1;pointer-events:none}
          .bgi{position:absolute;left:0;top:0;width:100%;height:100%;background-repeat:no-repeat;background-size:cover;display:none}
          #ios{isolation:isolate}
          #w.sl{transition:left .3s cubic-bezier(.2,.9,.3,1)}
          #dkt{display:none;position:fixed;top:0;width:24px;height:66px;z-index:2147483601;pointer-events:auto;touch-action:none;background:rgba(58,60,64,.94);box-shadow:0 2px 10px rgba(0,0,0,.35);align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
          #dkt.l{left:0;border-radius:0 14px 14px 0}
          #dkt.r{right:0;border-radius:14px 0 0 14px}
          #dkt svg{display:block}
          #dkt.r svg{transform:scaleX(-1)}
          #dkt:active{background:rgba(88,90,96,.96)}
          .ith{height:64px;border-radius:12px;background:var(--sub) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--t3);margin:2px 0 10px}
          .ibt{flex:1 1 100%}
          #pop.ios .ith{background-color:#232328;color:#8d8d93}
          #pop.ios .ibt{flex:1 1 40%;width:auto;height:52px;font:600 15px/1.1 Roboto,Arial,sans-serif;padding:0 8px}
          #sp{top:calc(env(safe-area-inset-top,0px) + 24px);transform:translateX(-50%);background:none;border:0;box-shadow:none;padding:0;color:rgba(255,255,255,.92);font:500 12px/1 Inter,'Segoe UI',Arial,sans-serif;letter-spacing:.04em;text-shadow:0 1px 3px rgba(0,0,0,.75)}
          #sp.in{animation:spfi .5s ease forwards}
          #sp.out{animation:spfo .6s ease forwards}
          @keyframes spfi{from{opacity:0}to{opacity:1}}
          @keyframes spfo{from{opacity:1}to{opacity:0}}
          #dkt{width:32px;height:96px;background:rgba(30,31,36,.78);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border:1px solid rgba(255,255,255,.14);box-shadow:0 8px 24px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.08)}
          #dkt.l{border-left:0;border-radius:0 20px 20px 0}
          #dkt.r{border-right:0;border-radius:20px 0 0 20px}
          #dkt svg{width:14px;height:26px;opacity:.95}
          #pop:not(.ios){--sf:#f5f5f7;--card:#fff;--tabon:#fff;--ac:#6d5ef0;border-radius:26px;box-shadow:0 30px 80px -14px rgba(0,0,0,.5)}
          html.dm #pop:not(.ios){--sf:#131316;--card:#1b1b20;--tabon:rgba(255,255,255,.13);--sub:#232329;--ac:#8b7cf0}
          #pop:not(.ios) .ph{padding:18px 14px 4px 20px;gap:6px}
