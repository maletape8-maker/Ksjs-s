                } else {
                  Engine_set_max_fps(engine, (int)(60 * Godot_Engine_speed));
                }
              }
            }

            os_unfair_lock_unlock(&Godot_Engine_lock);
          }

          void reset_Godot_Engine(void) {
            set_Godot_Engine(1.0);
          }
          BYSG_SRC_END
      - name: Ecrire LuckySpeeder.m
