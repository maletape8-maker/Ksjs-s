          static CADisplayLink *mcLink;
          static int mcPhase = 0, mcWait = 0, mcSeq = 0, mcN = 0;
          static CGPoint mcA[4], mcB[4];
          static UITouch *mcT[4];

          static void bysgMcPlan(void) {
            static const int bit[4] = {1, 2, 4, 8};
            int list[4], nl = 0;
            for (int i = 0; i < 4; i++) if (gMcDirs & bit[i]) list[nl++] = i;
            if (!nl) { list[nl++] = 0; list[nl++] = 1; }
            UIWindow *w = keyWin();
            CGSize sb = w ? w.bounds.size : CGSizeMake(390, 844);
            CGFloat half = MIN((CGFloat)gMcDist, MIN(sb.width, sb.height) * 0.8) * 0.5;
            CGPoint c = CGPointMake(sb.width * 0.5, sb.height * 0.58);
            int dirs[4], n = 0;
            if (gMcMode == 2) { for (int i = 0; i < nl; i++) dirs[n++] = list[i]; }
            else if (gMcMode == 1) dirs[n++] = list[arc4random_uniform((uint32_t)nl)];
            else dirs[n++] = list[(mcSeq++) % nl];
            mcN = n;
            for (int i = 0; i < n; i++) {
              CGFloat ox = (gMcMode == 2) ? (i - (n - 1) / 2.0) * 36.0 : 0;    // doigts simultanes : legerement decales
              CGFloat dx = 0, dy = 0;
              switch (dirs[i]) { case 0: dx = -1; break; case 1: dx = 1; break; case 2: dy = -1; break; default: dy = 1; break; }
              mcA[i] = CGPointMake(c.x + ox - dx * half, c.y - dy * half);
              mcB[i] = CGPointMake(c.x + ox + dx * half, c.y + dy * half);
            }
          }

          static void bysgMcSend(UITouchPhase ph) {
            UIWindow *w = keyWin();
            UIView *gv = w.rootViewController.view;
            if (!w || !gv) return;
            NSMutableDictionary<NSValue *, NSMutableArray *> *groups = [NSMutableDictionary dictionary];
            NSMutableDictionary<NSValue *, UIView *> *views = [NSMutableDictionary dictionary];
            for (int i = 0; i < mcN; i++) {
              CGPoint pw = (ph == UITouchPhaseBegan) ? mcA[i] : mcB[i];
              UIView *target = [gv hitTest:[gv convertPoint:mcA[i] fromView:w] withEvent:nil] ?: gv;
              if (ph == UITouchPhaseBegan || !mcT[i]) mcT[i] = bysgNewTouch();    // touche neuve a chaque glissement
              UITouch *t = mcT[i];
              if (!t) continue;
              bysgConfigTouch(t, w, target, pw, ph, ph == UITouchPhaseBegan);
              NSValue *key = [NSValue valueWithNonretainedObject:target];
              if (!groups[key]) { groups[key] = [NSMutableArray array]; views[key] = target; }
              [groups[key] addObject:t];
            }
            for (NSValue *key in groups) {
              NSSet *set = [NSSet setWithArray:groups[key]];
              UIView *target = views[key];
              UIEvent *ev = bysgTouchesEvent(set);
              @try {
                if (ph == UITouchPhaseBegan) [target touchesBegan:set withEvent:ev];
                else if (ph == UITouchPhaseMoved) [target touchesMoved:set withEvent:ev];
                else [target touchesEnded:set withEvent:ev];
              } @catch (__unused id e) {}
            }
          }

          @interface BYSGMcCtl : NSObject
          + (instancetype)shared; - (void)frame:(CADisplayLink *)l;
          @end
          @implementation BYSGMcCtl
          + (instancetype)shared { static BYSGMcCtl *s; static dispatch_once_t o; dispatch_once(&o, ^{ s = [BYSGMcCtl new]; }); return s; }
          - (void)frame:(CADisplayLink *)l {
            if (!gMcOn) return;
            if (mcWait > 0) { mcWait--; return; }
            if (mcPhase == 0) { bysgMcPlan(); bysgMcSend(UITouchPhaseBegan); mcPhase = 1; }
            else if (mcPhase == 1) { bysgMcSend(UITouchPhaseMoved); mcPhase = 2; }
            else { bysgMcSend(UITouchPhaseEnded); mcPhase = 0; mcWait = (gMcSpd >= 3) ? 0 : (gMcSpd == 2 ? 1 : 4); }
          }
          @end

          static void bysgMcConfig(BOOL on, int dirs, int mode, int spd, int dist) {
            gMcDirs = dirs & 15; gMcMode = mode < 0 ? 0 : (mode > 2 ? 2 : mode);
            gMcSpd = spd < 1 ? 1 : (spd > 3 ? 3 : spd);
            gMcDist = dist < 60 ? 60 : (dist > 320 ? 320 : dist);
            if (!mcLink) {
              mcLink = [CADisplayLink displayLinkWithTarget:[BYSGMcCtl shared] selector:@selector(frame:)];
              mcLink.preferredFramesPerSecond = UIScreen.mainScreen.maximumFramesPerSecond;
              [mcLink addToRunLoop:NSRunLoop.mainRunLoop forMode:NSRunLoopCommonModes];
              mcLink.paused = YES;
            }
            if (on == gMcOn) return;
            if (!on && mcPhase != 0) { bysgMcSend(UITouchPhaseEnded); mcPhase = 0; }   // pas de doigt reste coince
            gMcOn = on; mcPhase = 0; mcWait = 0;
            mcLink.paused = !on;
          }

          // ---------- Clavier : fleches + Z Q S D -> glissements ----------
          // Chaque touche = un glissement envoye a la vue du jeu (touches virtuelles, comme la Macro).
          // Le glissement part IMMEDIATEMENT a l'appui. Plusieurs touches en meme temps = les glissements s'enchainent sans pause :
          // le doigt se leve et le suivant se pose dans la meme image. Touche maintenue = le doigt reste pose au bout (long mouvement).
          static BOOL gKbOn = NO, gKbFast = YES;   // gKbFast : mode instantane (deplacement + relache dans la meme image)
          static int gKbDist = 200;
          static int kbHeld[4];                              // 0 gauche, 1 droite, 2 haut, 3 bas (nombre de touches enfoncees)
          static int kbQ[16], kbQn = 0;                      // file des glissements a faire
          static BOOL kbAct = NO;
          static int kbDir = 0, kbPh = 0;
          static CGPoint kbA, kbB;
          static UITouch *kbTouch;
          static CADisplayLink *kbLink;
          static BOOL kbReg = NO;

          static void bysgKbSend(UITouchPhase ph, CGPoint pw) {
            UIWindow *w = keyWin();
            UIView *gv = w.rootViewController.view;
            if (!w || !gv) return;
            UIView *target = [gv hitTest:[gv convertPoint:kbA fromView:w] withEvent:nil] ?: gv;
            if (ph == UITouchPhaseBegan || !kbTouch) kbTouch = bysgNewTouch();      // touche neuve a chaque glissement
            UITouch *t = kbTouch;
            if (!t) return;
            bysgConfigTouch(t, w, target, pw, ph, ph == UITouchPhaseBegan);
            NSSet *set = [NSSet setWithObject:t];
            UIEvent *ev = bysgTouchesEvent(set);
            @try {
              if (ph == UITouchPhaseBegan) [target touchesBegan:set withEvent:ev];
              else if (ph == UITouchPhaseMoved) [target touchesMoved:set withEvent:ev];
              else [target touchesEnded:set withEvent:ev];
            } @catch (__unused id e) {}
          }

          // pose le doigt du prochain glissement de la file (appele tout de suite a l'appui, ou dans l'image qui leve le precedent)
          static void bysgKbStartNext(void) {
            if (kbAct || kbQn == 0) return;
            UIWindow *w = keyWin();
            if (!w) { kbQn = 0; return; }
            kbDir = kbQ[0];
            memmove(kbQ, kbQ + 1, (size_t)(--kbQn) * sizeof(int));
            CGSize sb = w.bounds.size;
            CGFloat half = MIN((CGFloat)gKbDist, MIN(sb.width, sb.height) * 0.8) * 0.5;
            CGPoint c = CGPointMake(sb.width * 0.5, sb.height * 0.58);
            CGFloat dx = 0, dy = 0;
            switch (kbDir) { case 0: dx = -1; break; case 1: dx = 1; break; case 2: dy = -1; break; default: dy = 1; break; }
            kbA = CGPointMake(c.x - dx * half, c.y - dy * half);
            kbB = CGPointMake(c.x + dx * half, c.y + dy * half);
            kbAct = YES; kbPh = 1;
            bysgKbSend(UITouchPhaseBegan, kbA);
          }

          // leve le doigt courant puis enchaine tout de suite le suivant
          static void bysgKbEnd(void) {
            bysgKbSend(UITouchPhaseEnded, kbB);
            kbAct = NO; kbTouch = nil; kbPh = 0;
            bysgKbStartNext();
          }

          // Codes physiques : sur AZERTY, Z Q S D sont aux positions W A S D (on accepte aussi Z et Q au cas ou le code suit la lettre)
          static int bysgKbDir(GCKeyCode k) {
            if (k == GCKeyCodeLeftArrow  || k == GCKeyCodeKeyA || k == GCKeyCodeKeyQ) return 0;
            if (k == GCKeyCodeRightArrow || k == GCKeyCodeKeyD) return 1;
            if (k == GCKeyCodeUpArrow    || k == GCKeyCodeKeyW || k == GCKeyCodeKeyZ) return 2;
            if (k == GCKeyCodeDownArrow  || k == GCKeyCodeKeyS) return 3;
            return -1;
          }

          static void bysgKbReset(void) {
            if (kbAct) bysgKbSend(UITouchPhaseEnded, kbB);   // pas de doigt reste coince
            kbAct = NO; kbTouch = nil; kbQn = 0; kbPh = 0;
            for (int i = 0; i < 4; i++) kbHeld[i] = 0;
          }

          static void bysgKbAttach(void) {
            GCKeyboard *kb = GCKeyboard.coalescedKeyboard;
            if (!kb) return;
            kb.keyboardInput.keyChangedHandler = ^(GCKeyboardInput *input, GCControllerButtonInput *key, GCKeyCode code, BOOL pressed) {
              int d = bysgKbDir(code);
              if (d < 0 || !gKbOn) return;
              if (pressed) {
                if (kbHeld[d]++ == 0 && kbQn < 16) kbQ[kbQn++] = d;
                bysgKbStartNext();                           // zero delai : si le doigt est libre, il se pose maintenant
                if (kbAct && kbPh == 2 && kbQn > 0) bysgKbEnd();   // doigt deja au bout : on le leve et on enchaine tout de suite
                kbLink.paused = NO;
              } else if (kbHeld[d] > 0 && --kbHeld[d] == 0) {
                if (kbAct && kbPh == 2 && kbDir == d) bysgKbEnd();   // relache pendant le maintien : on leve tout de suite
              }
            };
          }

          @interface BYSGKbCtl : NSObject
          + (instancetype)shared; - (void)frame:(CADisplayLink *)l;
          @end
          @implementation BYSGKbCtl
          + (instancetype)shared { static BYSGKbCtl *s; static dispatch_once_t o; dispatch_once(&o, ^{ s = [BYSGKbCtl new]; }); return s; }
          - (void)frame:(CADisplayLink *)l {
            if (!gKbOn) { l.paused = YES; return; }
            if (!kbAct) {
              if (kbQn == 0) { l.paused = YES; return; }
              bysgKbStartNext();
              return;
            }
            if (kbPh == 1) {
              bysgKbSend(UITouchPhaseMoved, kbB); kbPh = 2;
              if (gKbFast && (kbQn > 0 || kbHeld[kbDir] == 0)) bysgKbEnd();   // instantane : relache dans la meme image, le suivant se pose aussitot
              return;
            }
            // maintien : le doigt reste au bout tant que la touche est enfoncee, sauf si un autre glissement attend
            if (kbHeld[kbDir] == 0 || kbQn > 0) bysgKbEnd();
          }
          @end

          static void bysgKbConfig(BOOL on, int dist, int mode) {
            gKbFast = mode != 0;
            gKbDist = dist < 60 ? 60 : (dist > 320 ? 320 : dist);
            if (!kbLink) {
              kbLink = [CADisplayLink displayLinkWithTarget:[BYSGKbCtl shared] selector:@selector(frame:)];
              kbLink.preferredFramesPerSecond = UIScreen.mainScreen.maximumFramesPerSecond;
              [kbLink addToRunLoop:NSRunLoop.mainRunLoop forMode:NSRunLoopCommonModes];
              kbLink.paused = YES;
            }
            if (!kbReg) {
              kbReg = YES;
              NSNotificationCenter *nc = NSNotificationCenter.defaultCenter;
              [nc addObserverForName:GCKeyboardDidConnectNotification object:nil queue:NSOperationQueue.mainQueue usingBlock:^(NSNotification *n) { if (gKbOn) bysgKbAttach(); }];
              [nc addObserverForName:GCKeyboardDidDisconnectNotification object:nil queue:NSOperationQueue.mainQueue usingBlock:^(NSNotification *n) { bysgKbReset(); }];
              [nc addObserverForName:UIApplicationWillResignActiveNotification object:nil queue:NSOperationQueue.mainQueue usingBlock:^(NSNotification *n) { bysgKbReset(); }];
            }
            if (on == gKbOn) return;
            if (!on) {
              bysgKbReset();
              GCKeyboard *kb = GCKeyboard.coalescedKeyboard;
              if (kb) kb.keyboardInput.keyChangedHandler = nil;
            }
            gKbOn = on;
            if (on) bysgKbAttach();
          }

          // Rafale : au depart de la partie, on appuie une fois sur chaque boost (3 passes pour etre sur), puis c'est fini.
          static void bysgBoostBurstAt(CFTimeInterval base, int delayMs) {
            for (int i = 0; i < 3; i++) if (boostDown[i] && !gBoostEdit) { bysgBoostSend(UITouchPhaseEnded, i); boostDown[i] = NO; }   // pas de doigt reste coince
            boostNSteps = 0; boostPos = 0;
            double hold = kHold[gBoostSpd], gap = kGap[gBoostSpd];
            CFTimeInterval nowT = CACurrentMediaTime();
            CFTimeInterval t = MAX(base + delayMs / 1000.0, nowT);   // le delai se compte depuis le son, pas depuis l'arrivee sur le thread principal
            for (int p = 0; p < 3; p++) {
              for (int i = 0; i < gABN && i < 3; i++) {
                if (boostNSteps + 2 > 96) break;
                boostSteps[boostNSteps++] = (BoostStep){t, i, 0};
                boostSteps[boostNSteps++] = (BoostStep){t + hold, i, 1};
                t += hold + gap;
              }
              t += 0.03;
            }
            gStopGuardUntil = t + 1.2;                       // les sons des boosts ne doivent pas arreter le chrono
          }
          static void bysgBoostBurst(int delayMs) { bysgBoostBurstAt(CACurrentMediaTime(), delayMs); }

          static void bysgBoostTick(CADisplayLink *l) {
            if (boostPos >= boostNSteps) return;
            CFTimeInterval now = CACurrentMediaTime();
            while (boostPos < boostNSteps && boostSteps[boostPos].t <= now + 0.002) {
              BoostStep st = boostSteps[boostPos++];
              if (gBoostEdit) continue;
              bysgBoostSend(st.ph == 0 ? UITouchPhaseBegan : UITouchPhaseEnded, st.idx);
              boostDown[st.idx] = (st.ph == 0);
            }
          }

          // appelee au son de depart : declenche la rafale (si l'Auto Boost est active)
          static void bysgBoostSetRun(BOOL r, CFTimeInterval tDet) { if (r && gABEnabled && !gBoostEdit) bysgBoostBurstAt(tDet, gABDelay); }
          static void bysgBoostRefresh(void) {
            for (int i = 0; i < 3; i++) boostSq[i].hidden = !(gBoostEdit && i < gABN);
            boostBar.hidden = !gBoostEdit;
          }

          @interface BYSGBoostCtl : NSObject
          + (instancetype)shared;
          - (void)frame:(CADisplayLink *)l; - (void)ok; - (void)pan:(UIPanGestureRecognizer *)g;
          @end
          @implementation BYSGBoostCtl
          + (instancetype)shared { static BYSGBoostCtl *s; static dispatch_once_t o; dispatch_once(&o, ^{ s = [BYSGBoostCtl new]; }); return s; }
          - (void)frame:(CADisplayLink *)l { bysgBoostTick(l); }
          - (void)ok {
            gBoostEdit = NO;
            UIWindow *w = boostBar.superview;
            CGSize sb = w ? w.bounds.size : CGSizeMake(414, 896);
            NSMutableArray *a = [NSMutableArray array];
            for (int i = 0; i < 3; i++) [a addObject:@[@(boostSq[i].center.x / sb.width), @(boostSq[i].center.y / sb.height)]];
            [NSUserDefaults.standardUserDefaults setObject:a forKey:@"bysgBoostN"];   // positions en fractions de l'ecran : valables quelle que soit la resolution
            bysgBoostRefresh();
          }
          - (void)pan:(UIPanGestureRecognizer *)g {
            UIView *v = g.view; UIView *p = v.superview;
            CGPoint d = [g translationInView:p];
            v.center = CGPointMake(v.center.x + d.x, v.center.y + d.y);
            [g setTranslation:CGPointZero inView:p];
          }
          @end

          static void bysgBoostStartEdit(void) {
            boostNSteps = boostPos = 0; for (int i = 0; i < 3; i++) boostDown[i] = NO;
            gBoostEdit = YES;
            bysgBoostRefresh();
          }

          static void bysgBoostTest(void) { gHudEv = @"test boost"; gHudEvT = CACurrentMediaTime(); gBoostEdit = NO; bysgBoostRefresh(); bysgBoostBurst(0); }

          static void bysgHudUpdate(void) {
            dbgLabel.hidden = !gABDbg;
            if (!gABDbg) return;
            CFTimeInterval now = CACurrentMediaTime();
            if (now - gHudT < 0.25) return;
            gHudT = now;
            float e[3], wv[3];
            bysgDetStats(e, wv);
            NSString *ev = (now - gHudEvT < 6.0) ? gHudEv : @"";
            dbgLabel.text = [NSString stringWithFormat:@" intro %.2f/%.2f  pièce %.2f/%.2f  mort %.2f/%.2f\n %@  Boost: %@ %@",
                             e[0], wv[0], e[1], wv[1], e[2], wv[2], ev.length ? ev : @"—",
                             gABEnabled ? @"ON" : @"OFF", @""];
          }

          static void bysgBoostEnsure(UIWindow *w) {
            if (!boostBar) {
              boostBar = [[UIView alloc] initWithFrame:CGRectZero];
              boostBtn = [UIButton buttonWithType:UIButtonTypeCustom];
              boostBtn.titleLabel.font = [UIFont systemFontOfSize:13 weight:UIFontWeightBold];
              [boostBtn setTitle:@"OK ✓  Valider les carrés" forState:UIControlStateNormal];
              [boostBtn setTitleColor:UIColor.whiteColor forState:UIControlStateNormal];
              boostBtn.backgroundColor = [UIColor colorWithRed:0.1 green:0.7 blue:0.3 alpha:0.95];
              boostBtn.layer.cornerRadius = 16; boostBtn.clipsToBounds = YES;
              boostBtn.contentEdgeInsets = UIEdgeInsetsMake(0, 14, 0, 14);
              [boostBtn addTarget:BYSGBoostCtl.shared action:@selector(ok) forControlEvents:UIControlEventTouchUpInside];
              [boostBar addSubview:boostBtn];
              NSArray *saved = [NSUserDefaults.standardUserDefaults arrayForKey:@"bysgBoostN"];
              CGSize sb = w.bounds.size;
              for (int i = 0; i < 3; i++) {
                UIView *q = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 54, 54)];
                q.backgroundColor = [UIColor colorWithRed:1 green:0.75 blue:0.1 alpha:0.28];
                q.layer.borderColor = [UIColor colorWithRed:1 green:0.75 blue:0.1 alpha:1].CGColor; q.layer.borderWidth = 2; q.layer.cornerRadius = 6;
                UILabel *lb = [[UILabel alloc] initWithFrame:q.bounds]; lb.text = [NSString stringWithFormat:@"%d", i + 1];
                lb.textAlignment = NSTextAlignmentCenter; lb.textColor = UIColor.whiteColor; lb.font = [UIFont boldSystemFontOfSize:20];
                lb.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
                [q addSubview:lb];
                CGPoint c = CGPointMake(sb.width * 0.10, sb.height * (0.52 + 0.10 * i));   // par defaut : a gauche
                if (i < (int)saved.count && [saved[i] isKindOfClass:NSArray.class] && [saved[i] count] == 2) c = CGPointMake([saved[i][0] doubleValue] * sb.width, [saved[i][1] doubleValue] * sb.height);
                q.center = c; q.hidden = YES;
                [q addGestureRecognizer:[[UIPanGestureRecognizer alloc] initWithTarget:BYSGBoostCtl.shared action:@selector(pan:)]];
                boostSq[i] = q;
              }
              dbgLabel = [[UILabel alloc] initWithFrame:CGRectZero];
              dbgLabel.numberOfLines = 2; dbgLabel.userInteractionEnabled = NO;
              dbgLabel.font = [UIFont monospacedSystemFontOfSize:9 weight:UIFontWeightMedium];
              dbgLabel.textColor = UIColor.whiteColor; dbgLabel.backgroundColor = [UIColor colorWithWhite:0 alpha:0.45];
              dbgLabel.layer.cornerRadius = 5; dbgLabel.clipsToBounds = YES;
              boostLink = [CADisplayLink displayLinkWithTarget:BYSGBoostCtl.shared selector:@selector(frame:)];
              [boostLink addToRunLoop:NSRunLoop.mainRunLoop forMode:NSRunLoopCommonModes];
              bysgBoostRefresh();
            }
            if (boostBar.superview != w) { [w addSubview:boostBar]; [w addSubview:dbgLabel]; for (int i = 0; i < 3; i++) [w addSubview:boostSq[i]]; }
            static CGSize lastSz;
            if (!gBoostEdit && (fabs(lastSz.width - w.bounds.size.width) > 1 || fabs(lastSz.height - w.bounds.size.height) > 1)) {
              NSArray *sv = [NSUserDefaults.standardUserDefaults arrayForKey:@"bysgBoostN"];
              for (int i = 0; i < 3; i++) {
                CGPoint c = CGPointMake(w.bounds.size.width * 0.10, w.bounds.size.height * (0.52 + 0.10 * i));
                if (i < (int)sv.count && [sv[i] isKindOfClass:NSArray.class] && [sv[i] count] == 2) c = CGPointMake([sv[i][0] doubleValue] * w.bounds.size.width, [sv[i][1] doubleValue] * w.bounds.size.height);
                boostSq[i].center = c;
              }
              lastSz = w.bounds.size;
            }
            UIEdgeInsets si = w.safeAreaInsets;
            [boostBtn sizeToFit];
            CGFloat bw = MAX(boostBtn.bounds.size.width, 160), h = 32;
            boostBtn.frame = CGRectMake(0, 0, bw, h);
            boostBar.frame = CGRectMake(MAX(si.left, 8) + 6, w.bounds.size.height - h - MAX(si.bottom, 8) - 6, bw, h);
            dbgLabel.frame = CGRectMake(MAX(si.left, 6) + 4, MAX(si.top, 6) + 2, MIN(w.bounds.size.width - 20, 330), 26);
            bysgHudUpdate();
          }

          // ---------- Frequence d'images maximale (120 FPS si l'ecran le permet) ----------
          // Force le rythme de tous les CADisplayLink du jeu au maximum de l'ecran. Un iPhone 11 est limite a 60 Hz par son ecran.
          static NSHashTable<CADisplayLink *> *gLinks;
          static void (*o_addRL)(id, SEL, NSRunLoop *, NSRunLoopMode);
          static void (*o_setPFPS)(id, SEL, NSInteger);
          static void bysgApplyRate(CADisplayLink *l) {
            NSInteger mx = UIScreen.mainScreen.maximumFramesPerSecond;
            if (l == boostLink) return;
            if (@available(iOS 15.0, *)) l.preferredFrameRateRange = CAFrameRateRangeMake((float)mx, (float)mx, (float)mx);
            if (o_setPFPS) o_setPFPS(l, @selector(setPreferredFramesPerSecond:), mx); else l.preferredFramesPerSecond = mx;
          }
          static void bysgApplyAllFps(void) { for (CADisplayLink *l in gLinks.allObjects) bysgApplyRate(l); }
          static void h_addRL(id self, SEL _cmd, NSRunLoop *rl, NSRunLoopMode m) {
            if (!gLinks) gLinks = [NSHashTable weakObjectsHashTable];
            [gLinks addObject:self];
            if (gForceFps) bysgApplyRate(self);
            o_addRL(self, _cmd, rl, m);
          }
          static void h_setPFPS(id self, SEL _cmd, NSInteger v) {
            if (gForceFps && self != boostLink) v = UIScreen.mainScreen.maximumFramesPerSecond;
            o_setPFPS(self, _cmd, v);
          }
          static void bysgInstallForceFps(void) {
            Method m1 = class_getInstanceMethod(CADisplayLink.class, @selector(addToRunLoop:forMode:));
            if (m1) { o_addRL = (void *)method_getImplementation(m1); method_setImplementation(m1, (IMP)h_addRL); }
            Method m2 = class_getInstanceMethod(CADisplayLink.class, @selector(setPreferredFramesPerSecond:));
            if (m2) { o_setPFPS = (void *)method_getImplementation(m2); method_setImplementation(m2, (IMP)h_setPFPS); }
          }

          __attribute__((constructor)) static void bysg_init(void) {
            bysgInstallFps();
            bysgInstallAudio();
            bysgInstallForceFps();
            dispatch_async(dispatch_get_main_queue(), ^{
              __block int lastN = 0;
              __block CFAbsoluteTime lastT = CFAbsoluteTimeGetCurrent();
              [NSTimer scheduledTimerWithTimeInterval:1.0 repeats:YES block:^(NSTimer *t) {
                int n = gFr;
                CFAbsoluteTime now = CFAbsoluteTimeGetCurrent();
                double dt = now - lastT;
                int d = n - lastN;
                lastN = n; lastT = now;
                if (host && d > 0 && dt > 0.2)
                  [host.web evaluateJavaScript:[NSString stringWithFormat:@"window.FP&&FP(%d)", (int)lround(d / dt)] completionHandler:nil];
              }];
              [NSTimer scheduledTimerWithTimeInterval:0.1 repeats:YES block:^(NSTimer *t) {
                UIWindow *w = keyWin();
                if (!w) return;
                bysgStretch(w);
                if (!host) host = [[BYSGHost alloc] initWithFrame:w.bounds];
